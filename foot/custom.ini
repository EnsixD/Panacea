# Пользовательские настройки терминала foot в Panacea.
#
# Этот файл сохраняется при любых обновлениях Panacea и никогда не затирается.
# Секции и параметры здесь имеют наивысший приоритет и переопределяют значения из foot.ini.
#
# Примеры:
#
# [main]
# shell=/usr/bin/fish
# font=JetBrainsMono Nerd Font:size=15
# pad=20x16 center
#
# [key-bindings]
# clipboard-copy=Control+Shift+c XF86Copy
# clipboard-paste=Control+Shift+v XF86Paste
