# Терминал в стиле динамического острова: чёрный фон, много воздуха,
# ни рамок, ни заголовка, тонкая каретка. Цвета темы подключаются файлом
# theme, который переписывает switch_theme.sh.
# ~ вместо домашнего пути: файл уезжает всем, и чужой /home/<имя> в нём
# ломал бы include у каждого, кроме автора.
include=~/.config/foot/theme
# Второй файл пишет сама оболочка, и он идёт после первого: на теме Nothing
# фон терминала должен совпасть с карточками виджетов, а общая палитра о
# темах не знает. Порядок важен — побеждает тот, что подключён позже.
# Файл создаётся при первом же запуске оболочки; пустой он ничего не меняет.
include=~/.config/foot/panacea-theme

[main]
shell=/usr/bin/fish
font=JetBrainsMono Nerd Font:size=16
# межстрочный не задаём: у 16-го кегля свои метрики, ручное значение
# было подогнано под мелкий шрифт и сплющивало строки
# просторные поля — как отступы внутри пилюли
pad=22x18 center
selection-target=clipboard

[cursor]
# тонкая вертикальная каретка вместо жирного блока
style=beam
beam-thickness=1
blink=yes
blink-rate=600

# рамку и заголовок рисовать некому и незачем: окно и так со скруглением
# от Hyprland
[csd]
preferred=none

[scrollback]
lines=10000
indicator-position=none

# alpha живёт в той же секции, что и цвета темы: отдельная [colors]
# помечена устаревшей и ругается при запуске.
#
# Секция берётся, только когда портал сообщает color-scheme=prefer-dark.
# При «default» foot молча оставался на своём сером 242424 — поэтому
# switch_theme.sh заодно выставляет тёмную схему в gsettings.
[colors-dark]
# Непрозрачный, и это не опечатка.
#
# Прозрачностью терминала распоряжается ползунок в настройках оболочки, а
# делает он это правилом компоновщика: сам foot перечитывает конфиг только
# при запуске, и ползунок не менял бы ничего в открытом окне. Своя alpha
# здесь перемножалась бы с правилом — на единице ползунка окно всё равно
# оставалось бы полупрозрачным, и «непрозрачно» было бы недостижимо.
alpha=1.0

[mouse]
hide-when-typing=yes
