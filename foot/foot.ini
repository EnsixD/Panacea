# Терминал в стиле динамического острова: чёрный фон, много воздуха,
# ни рамок, ни заголовка, тонкая каретка. Цвета темы подключаются файлом
# theme, который переписывает switch_theme.sh.
include=/home/ensi/.config/foot/theme

[main]
shell=/usr/bin/fish
font=JetBrainsMono Nerd Font:size=16
# межстрочный не задаём: у 16-го кегля свои метрики, ручное значение
# было подогнано под мелкий шрифт и сплющивало строки
# просторные поля — как отступы внутри пилюли
pad=22x18 center
selection-target=clipboard

[cursor]
# тонкая вертикальная каретка вместо жирного блока
style=beam
beam-thickness=1
blink=yes
blink-rate=600

# рамку и заголовок рисовать некому и незачем: окно и так со скруглением
# от Hyprland
[csd]
preferred=none

[scrollback]
lines=10000
indicator-position=none

# alpha живёт в той же секции, что и цвета темы: отдельная [colors]
# помечена устаревшей и ругается при запуске.
#
# Секция берётся, только когда портал сообщает color-scheme=prefer-dark.
# При «default» foot молча оставался на своём сером 242424 — поэтому
# switch_theme.sh заодно выставляет тёмную схему в gsettings.
[colors-dark]
# Непрозрачный. Любая прозрачность пускала внутрь размытые обои, и почти
# чёрный 0c0b0a на экране читался холодным серо-синим — светлее самих
# обоев. Цвет терминала теперь ровно тот, что задан темой, и от картинки
# на рабочем столе не зависит.
alpha=1.0

[mouse]
hide-when-typing=yes
