# Файл переписывает switch_theme.sh при каждой смене обоев.
# Здесь — состояние по умолчанию: обои, которые точно есть в репозитории.
# minimal.jpg отсюда убран вместе с остальными: остались ember_stripes и misty_peaks.
preload = ~/.config/hypr/wallpaper/ember_stripes.jpg
wallpaper = ,~/.config/hypr/wallpaper/ember_stripes.jpg
splash = false
ipc = on
