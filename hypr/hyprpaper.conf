# Файл переписывает switch_theme.sh при каждой смене обоев.
# Здесь — состояние по умолчанию: обои, которые точно есть в репозитории.
# minimal.jpg отсюда убран вместе с остальными: остались line и mountains.
preload = ~/.config/hypr/wallpaper/line.jpg
wallpaper = ,~/.config/hypr/wallpaper/line.jpg
splash = false
ipc = on
