# Запасной конфиг экранов — для Hyprland без Lua. Активный путь берёт настройки
# из lua/monitors.lua (а тот — из lua/monitors_data.lua, который панель Display
# собирает из settings.json). Здесь только общий дефолт: любой подключённый
# монитор в предпочтительном режиме, масштаб 1.0.
#
# Свои разрешение/частоту/масштаб задавай в настройках (Super+I → Display) —
# они переживут обновление. Правки прямо здесь тоже сохранятся: файл в KEEP.
monitor=,preferred,auto,1.0
