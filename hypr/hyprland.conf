##############################################################################
# Запасной конфиг — для Hyprland, который не умеет читать hyprland.lua.
#
# Настоящий конфиг Panacea лежит в hyprland.lua и модулях lua/. Hyprland,
# умеющий Lua, выбирает его сам и этот файл не читает вовсе — он существует
# ровно для того, чтобы на версии постарше система не поднималась голой:
# без сочетаний, без пилюли и без возможности открыть терминал.
#
# Поэтому здесь нарочно нет паритета с lua/: повторять двести строк в двух
# местах — значит через месяц иметь два разных конфига, один из которых врёт.
# Здесь только то, без чего нельзя работать: оболочка, окна, столы, звук.
# Всё остальное — в lua/, и правильный ответ на «чего-то не хватает» —
# обновить Hyprland, а не дописывать сюда.
##############################################################################

$mainMod = SUPER
$terminal = footclient
$shell = qs -c $HOME/.config/panacea
$pill = qs -c $HOME/.config/panacea ipc call pill

exec-once = $shell
exec-once = hyprpaper
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = udiskie --no-notify --no-tray
exec-once = hyprsunset -t 5000

# ------------------------------------------------------------------ пилюля
bind = $mainMod, A, exec, $pill launcher
bind = $mainMod, Tab, exec, $pill overview
bind = $mainMod, Z, exec, $pill controls
bind = $mainMod, I, exec, $pill settings
bind = $mainMod, slash, exec, $pill shortcuts
bind = $mainMod SHIFT, W, exec, $pill wifi
bind = $mainMod SHIFT, B, exec, $pill bluetooth
bind = $mainMod, V, exec, $pill clipboard
bind = CTRL ALT, Delete, exec, $pill powermenu
bind = $mainMod SHIFT, N, exec, $pill notifications
bind = $mainMod, P, exec, $pill record
bind = $mainMod SHIFT, P, exec, $pill passwords
bind = $mainMod, E, exec, $pill files
bind = $mainMod SHIFT, T, exec, $pill theme
bind = , Alt_R, exec, $HOME/.config/panacea/scripts/voxtype.sh start
bindr = , Alt_R, exec, $HOME/.config/panacea/scripts/voxtype.sh stop
bind = , code:108, exec, $HOME/.config/panacea/scripts/voxtype.sh start
bindr = , code:108, exec, $HOME/.config/panacea/scripts/voxtype.sh stop


# ------------------------------------------------------------- приложения
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, F, exec, firefox

# ------------------------------------------------------------------- окна
bind = $mainMod, Q, exec, $HOME/.config/panacea/scripts/smart_close.sh
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, W, togglefloating
bind = $mainMod SHIFT, M, exit
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ---------------------------------------------------------- рабочие столы
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# ------------------------------------------------------- громкость, яркость
# Через те же скрипты, что и основной конфиг: шаг растёт при удержании,
# а уровень показывает сама пилюля.
bindel = , XF86AudioRaiseVolume, exec, $HOME/.local/bin/smart_volume.sh up
bindel = , XF86AudioLowerVolume, exec, $HOME/.local/bin/smart_volume.sh down
bindl  = , XF86AudioMute,        exec, $HOME/.local/bin/smart_volume.sh mute
bindel = , XF86MonBrightnessUp,   exec, $HOME/.local/bin/smart_brightness.sh up
bindel = , XF86MonBrightnessDown, exec, $HOME/.local/bin/smart_brightness.sh down
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# крышка ноутбука — блокировка
bindl = , switch:on:Lid Switch,  exec, $HOME/.config/panacea/scripts/lock.sh

# ------------------------------------------------------------------- вид
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    layout = dwindle
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
