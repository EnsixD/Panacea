# Полоска громкости и яркости для режима энергосбережения: в нём пилюля
# погашена, и уровень показать больше некому.
#
# Цвета берутся из единственной палитры — этот файл перезаписывает
# hypr/scripts/palette.sh. Значения ниже совпадают с палитрой по умолчанию и
# нужны на случай, если wob запустили до первого прогона скрипта.

timeout = 1000
max = 100
width = 100
height = 20
border_offset = 0
border_size = 2
bar_padding = 3
anchor = bottom
margin = 60

# RRGGBB[AA], без «#»
background_color = 1b2b34
bar_color = c65a47
border_color = e5d1c5

# Значения больше max показываем как max, а не заворачиваем в ноль:
# громкость выше 100% выглядела бы как полная тишина.
overflow_mode = nowrap
